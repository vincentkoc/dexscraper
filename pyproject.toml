[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dexscraper"
description = "Real-time DexScreener WebSocket scraper for cryptocurrency data"
authors = [
    {name = "Vincent Koc"},
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "cryptocurrency",
    "trading",
    "websocket",
    "dexscreener",
    "solana",
    "defi",
    "real-time",
    "market-data"
]
dependencies = [
    "websockets>=15.0",
    "cloudscraper>=1.2.71",
    "requests>=2.33.0",
    "typing_extensions>=4.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/vincentkoc/dexscraper"
Repository = "https://github.com/vincentkoc/dexscraper.git"
Issues = "https://github.com/vincentkoc/dexscraper/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=2.12.0",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "pre-commit>=4.3.0",
    "filelock>=3.20.3",
    "build>=0.8.0",
    "twine>=4.0.0",
]

[project.scripts]
dexscraper = "dexscraper.cli:cli_main"

[tool.setuptools]
packages = ["dexscraper", "dexscraper.extraction"]

[tool.setuptools_scm]
local_scheme = "no-local-version"


[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["dexscraper/_version.py"]

[tool.ruff.lint]
extend-ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow",
    "integration: live network / WebSocket tests (require DEXSCRAPER_LIVE=1)",
    "live: alias for integration (require DEXSCRAPER_LIVE=1)",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "dexscraper/_version.py"
]

[[tool.mypy.overrides]]
module = [
    "websockets.*",
    "cloudscraper.*",
    "setuptools_scm.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["dexscraper"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]
