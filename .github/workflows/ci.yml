name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  version_guard:
    name: Version Guard (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate SCM version is dev on main
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools_scm[toml]>=6.2"
        VERSION="$(python -c 'from setuptools_scm import get_version; print(get_version(root=".", local_scheme="no-local-version"))')"
        TAG_ON_HEAD="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$' | head -n 1 || true)"
        echo "Computed SCM version: ${VERSION}"
        if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          if [[ -n "${TAG_ON_HEAD}" ]]; then
            echo "✅ main branch is on tagged release commit (${TAG_ON_HEAD}); stable version is expected."
            exit 0
          fi
          echo "❌ main branch resolved to a stable release version (${VERSION})."
          echo "   Stable versions must only be produced by tag-based release workflow."
          exit 1
        fi
        echo "✅ main branch version is non-stable: ${VERSION}"

  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install lint/type tools
      run: |
        python -m pip install --upgrade pip
        pip install "ruff==0.17.3" "mypy==2.4.0" "typing_extensions>=4.0"
        pip install -e .

    - name: Ruff check
      run: |
        ruff --version
        ruff check dexscraper tests

    - name: Ruff format check
      run: |
        ruff format --check dexscraper tests

    - name: Mypy
      run: |
        mypy --version
        mypy dexscraper


  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest pytest-cov pytest-asyncio
        pip install -e .[dev]

    - name: Test with pytest
      run: |
        pytest tests/ -v -m "not integration and not live" --cov=dexscraper --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit
        pip install -e .

    - name: Security check with bandit
      run: |
        bandit -r dexscraper/

    - name: Dependency vulnerability scan (pip-audit)
      run: |
        pip-audit -r requirements.txt --ignore-vuln GHSA-h95x-26f3-88hr

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: python -m twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
